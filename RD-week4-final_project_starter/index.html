
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Places in Vietnam</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body onload="addTabFocus()">

  <header>
    <h1>Beautiful Places in Vietnam</h1>
  </header>

  <main>
    <div id="image">
      Hover over or focus on an image below to display details here.
    </div>

    <div class="gallery">
      <figure>
        <img src="images/hanoi.jpg" alt="Hoan Kiem Lake in Hanoi"
          onmouseover="upDate(this)" onmouseleave="unDo()"
          onfocus="upDate(this)" onblur="unDo()">
        <figcaption>Hanoi</figcaption>
      </figure>

      <figure>
        <img src="images/HaLongBay.jpg" alt="Limestone islands in Ha Long Bay"
          onmouseover="upDate(this)" onmouseleave="unDo()"
          onfocus="upDate(this)" onblur="unDo()">
        <figcaption>Ha Long Bay</figcaption>
      </figure>

      <figure>
        <img src="images/danang.jpg" alt="A beach and bridge in Da Nang"
          onmouseover="upDate(this)" onmouseleave="unDo()"
          onfocus="upDate(this)" onblur="unDo()">
        <figcaption>Da Nang</figcaption>
      </figure>

      <figure>
        <img src="images/HoiAn.jpg" alt="Colorful lanterns in Hoi An ancient town"
          onmouseover="upDate(this)" onmouseleave="unDo()"
          onfocus="upDate(this)" onblur="unDo()">
        <figcaption>Hoi An</figcaption>
      </figure>

      <figure>
        <img src="images/DaLat.jpg" alt="Pine trees and lake scenery in Da Lat"
          onmouseover="upDate(this)" onmouseleave="unDo()"
          onfocus="upDate(this)" onblur="unDo()">
        <figcaption>Da Lat</figcaption>
      </figure>

      <figure>
        <img src="images/PhuQUoc.jpg" alt="Sunset on a beach in Phu Quoc"
          onmouseover="upDate(this)" onmouseleave="unDo()"
          onfocus="upDate(this)" onblur="unDo()">
        <figcaption>Phu Quoc</figcaption>
      </figure>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>

</html>
